name: Aurikrex Bytes Push Notifications

on:
  schedule:
    # 8:01 AM WAT (7:01 AM UTC)
    - cron: "1 7 * * *"
    # 4:07 PM WAT (3:07 PM UTC)
    - cron: "33 16 * * *"
    # 10:00 PM WAT (9:00 PM UTC)
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-notifications:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger push notification API
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          CRON_SEC="${CRON_SECRET:-}"
          if [ -z "$CRON_SEC" ]; then
            echo "CRON_SECRET is not configured in GitHub Actions secrets."
            exit 1
          fi
          response="$(curl --show-error --silent --write-out '\n%{http_code}' \
            --connect-timeout 15 --max-time 60 \
            -H "Authorization: Bearer ${CRON_SEC}" \
            -H "Accept: application/json" \
            "https://www.bytes.aurikrex.tech/api/cron/notify")"
          status="$(echo "$response" | tail -n 1)"
          body="$(echo "$response" | sed '$d')"
          echo "HTTP status: $status"
          echo "Response: $body"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Notification API request failed."
            exit 1
          fi
          found="$(echo "$body" | jq -r '.sent.found // .found // 0')"
          sent="$(echo "$body" | jq -r '.sent.sent // .sent // 0')"
          failed="$(echo "$body" | jq -r '.sent.failed // .failed // 0')"
          echo "Summary: found=$found, sent=$sent, failed=$failed"
          if [ "$failed" -gt 0 ] || [ "$sent" -lt 1 ]; then
            echo "Notification delivery failed or reached no subscribers."
            exit 1
          fi
