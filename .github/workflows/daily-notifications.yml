name: Aurikrex Bytes Push Notifications

on:
  schedule:
    # 8:01 AM WAT (7:01 UTC)
    - cron: "1 7 * * *"
    # 10:00 PM WAT (21:00 UTC)
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-notifications:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger push notification API
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET" || { echo "CRON_SECRET is not configured in GitHub Actions" >&2; exit 1; }
          response="$(curl --fail-with-body --show-error --silent \
            --retry 3 --retry-delay 5 --retry-all-errors \
            --connect-timeout 15 --max-time 60 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Accept: application/json" \
            "https://www.bytes.aurikrex.tech/api/cron/notify")"
          echo "$response"
          echo "$response" | grep -q '"sent"' || { echo "Notification endpoint returned an unexpected response" >&2; exit 1; }
