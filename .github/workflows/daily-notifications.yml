name: Aurikrex Bytes Push Notifications

on:
  schedule:
    # 7:35 AM WAT (6:35 UTC)
    - cron: "35 6 * * *"
    # 7:40 AM WAT (6:40 UTC)
    - cron: "40 6 * * *"
    # 7:45 AM WAT (6:45 UTC)
    - cron: "45 6 * * *"
    # 8:01 AM WAT (7:01 UTC)
    - cron: "1 7 * * *"
    # 10:00 PM WAT (21:00 UTC)
    - cron: "0 21 * * *"
    # 12:00 AM WAT (23:00 UTC)
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-notifications:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger push notification API
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          CRON_SEC="${CRON_SECRET:-}"
          if [ -z "$CRON_SEC" ]; then
            echo "CRON_SECRET is not configured in GitHub Actions secrets."
            exit 1
          fi
          response="$(curl --fail-with-body --show-error --silent \
            --retry 3 --retry-delay 5 --retry-all-errors \
            --connect-timeout 15 --max-time 60 \
            -H "Authorization: Bearer ${CRON_SEC}" \
            -H "Accept: application/json" \
            "https://www.bytes.aurikrex.tech/api/cron/notify")"
          echo "$response"
          found="$(echo "$response" | jq -r '.sent.found // .found // 0')"
          sent="$(echo "$response" | jq -r '.sent.sent // .sent // 0')"
          failed="$(echo "$response" | jq -r '.sent.failed // .failed // 0')"
          echo "Summary: found=$found, sent=$sent, failed=$failed"
